name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: the tier law against fallworld's own examples (vendored verbatim)
        run: node --test tier.test.mjs

      - name: the catalogue law against its own examples
        run: node --test catalogue.test.mjs

      - name: the mint law against its own examples
        run: node --test mint.test.mjs

      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tier law (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate tier.mjs \
            --timeout 60000 --cap 5000 \
            --test node --test tier.test.mjs

      - name: witness — try to break the catalogue law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate catalogue.mjs \
            --timeout 60000 --cap 5000 \
            --baseline witness.baseline.json \
            --test node --test catalogue.test.mjs

      - name: witness — try to break the mint law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate mint.mjs \
            --timeout 60000 --cap 5000 \
            --baseline mint.baseline.json \
            --test node --test mint.test.mjs

      - name: leak guard — the committed public index must contain zero private nodes
        run: |
          node -e "
            const idx = require('./estate-index-public.json');
            const priv = idx.nodes.filter((n) => n.private === true);
            if (priv.length) { console.error('REFUSED: ' + priv.length + ' private node(s) in a PUBLIC index — a leak'); process.exit(1); }
            console.log('leak guard clean — ' + idx.nodes.length + ' public nodes, 0 private');
          "

      - name: the shipped catalogue data was actually built by the gated law, not hand-typed
        run: |
          node build-catalogue.mjs
          git diff --exit-code catalogue-data.json || \
            (echo "REFUSED: catalogue-data.json does not match a fresh build — it was edited by hand or evidence went stale" && exit 1)

      - name: the shipped mint data was actually derived by the gated law, not hand-typed
        run: |
          node build-mint.mjs
          git diff --exit-code mint-data.json || \
            (echo "REFUSED: mint-data.json does not match a fresh derivation from mint-raw.json" && exit 1)

      - name: every shipped mint entry names a repo the catalogue holds as mint-eligible
        run: |
          node -e "
            const cat = require('./catalogue-data.json');
            const mint = require('./mint-data.json');
            const ok = new Set(cat.rows.filter((r) => r.mintEligible).map((r) => r.name));
            const bad = Object.keys(mint.apps).filter((n) => !ok.has(n));
            if (bad.length) { console.error('REFUSED: mint data names non-eligible repos:', bad.join(', ')); process.exit(1); }
            console.log('mint data clean — ' + Object.keys(mint.apps).length + ' entries, all mint-eligible');
          "

      - name: page gate — no pricing, Konomi credit, the mint affordance is granted by the LAW
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const fails = [];
            if (/£\d|\\\$\d|per\s*(seat|month|user)\b/i.test(html.replace(/Nothing here has a price\.?/i, ''))) fails.push('pricing text found');
            if (!/konomi/i.test(html)) fails.push('no Konomi credit');
            if (/coming soon/i.test(html)) fails.push('a coming-soon label survived Phase 2 — stale honesty is dishonesty');
            if (!/import\s*\{[^}]*mintDecision[^}]*\}\s*from\s*'\.\/mint\.mjs'/.test(html)) fails.push('the page does not import the gated mint law — the live logic must BE the gated logic');
            if (!/mintDecision\(/.test(html)) fails.push('no call to mintDecision — the affordance is not granted by the law');
            if (fails.length) { console.error('REFUSED:', fails.join('; ')); process.exit(1); }
            console.log('page gate clean');
          "
